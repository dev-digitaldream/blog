name: Validate Astro 7 migration

on:
  push:
    branches:
      - upgrade/astro-7
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Upgrade npm resolver
        run: npm install -g npm@11
      - name: Regenerate Astro 7 lockfile
        run: |
          rm package-lock.json
          npm install --install-strategy=nested --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --install-strategy=nested --no-audit --no-fund
      - name: Validate Astro build
        run: npm run build
      - name: Commit lockfile only after successful build
        if: github.ref == 'refs/heads/upgrade/astro-7'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m "chore: regenerate Astro 7 package-lock after successful build"
            git push origin HEAD:upgrade/astro-7
          fi
