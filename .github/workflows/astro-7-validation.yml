name: Validate Astro 7 updated site
on:
  push:
    branches: [upgrade/astro-7]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Use npm 11 resolver
        run: npm install -g npm@11
      - name: Install from committed lockfile
        run: npm ci --install-strategy=nested --no-audit --no-fund
      - name: Build entire site
        run: npm run build
