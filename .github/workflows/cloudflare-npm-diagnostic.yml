name: Diagnose Cloudflare npm compatibility

on:
  push:
    branches: [upgrade/astro-7]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare-equivalent:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        npm-version: ['10.9.2', '11']
        install: ['default', 'nested']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Choose npm version
        run: npm install --global npm@${{ matrix.npm-version }}
      - name: Print environment
        run: node --version && npm --version
      - name: Install pinned packages
        run: |
          if [ "${{ matrix.install }}" = nested ]; then
            npm ci --install-strategy=nested --no-audit --no-fund
          else
            npm ci --no-audit --no-fund
          fi
      - name: Build with Astro 7
        run: npm run build
